name: veterinary

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-node-18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      - run: npm install
      - name: Start bot and finish workflow
        run: |
          echo "Starting bot with Node 18..."
          npm start 2>&1 | tee bot.log &
          BOT_PID=$!
          echo "Waiting for bot to log in..."
          while ! grep -q "Logged in as cataas#8028" bot.log; do
            sleep 1
          done
          echo "Bot logged in"
          kill $BOT_PID

  test-node-20:
